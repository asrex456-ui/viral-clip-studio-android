name: Build Viral Clip Studio Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize & Configure Android SDK 36
        run: |
          mkdir -p backup_files
          cp -r android/app/src/main/AndroidManifest.xml backup_files/ 2>/dev/null || true
          cp pubspec.yaml backup_files/
          rm -rf android
          flutter create . --project-name viral_clip_studio --org com.avinash
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              if (project.name != "app" && !project.state.executed) {
                  afterEvaluate {
                      val androidExt = extensions.findByName("android")
                      if (androidExt != null) {
                          val current = try {
                              androidExt.javaClass.getMethod("getCompileSdk").invoke(androidExt) as? Int
                          } catch (e: Exception) {
                              null
                          }
                          if (current == null || current < 36) {
                              try {
                                  androidExt.javaClass.getMethod("setCompileSdk", Int::class.javaObjectType).invoke(androidExt, 36)
                              } catch (e: Exception) {
                                  try {
                                      androidExt.javaClass.getMethod("compileSdkVersion", Int::class.java).invoke(androidExt, 36)
                                  } catch (e2: Exception) {
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Restore Custom Manifest & Pubspec
        run: |
          cp backup_files/pubspec.yaml pubspec.yaml
          cp backup_files/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Get Flutter Dependencies & Patch Plugin SDK
        run: |
          flutter pub get
          find "$HOME/.pub-cache/hosted/pub.dev" -name "build.gradle" -exec sed -i -E 's/^([[:space:]]*)(compileSdkVersion|compileSdk)([[:space:]]*=?[[:space:]]*|\()[[:space:]]*(3[0-5]|2[0-9])\)?/\1compileSdk 36/g' {} + 2>/dev/null || true
          find "$HOME/.pub-cache/hosted/pub.dev" -name "build.gradle.kts" -exec sed -i -E 's/^([[:space:]]*)(compileSdkVersion|compileSdk)([[:space:]]*=?[[:space:]]*|\()[[:space:]]*(3[0-5]|2[0-9])\)?/\1compileSdk = 36/g' {} + 2>/dev/null || true

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viral_Clip_Studio_Android_APK
          path: build/app/outputs/flutter-apk/app-release.apk
