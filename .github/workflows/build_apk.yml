name: Build Viral Clip Studio Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Initialize Android Platform Files
        run: flutter create --platforms=android .
      - name: Restore Custom Manifest & Pubspec
        run: git checkout -- android/app/src/main/AndroidManifest.xml pubspec.yaml lib/main.dart
      - name: Get Flutter Dependencies
        run: flutter pub get
      - name: Build Release APK
        run: flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viral_Clip_Studio_Android_APK
          path: build/app/outputs/flutter-apk/app-release.apk
