name: Build Viral Clip Studio Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize & Configure Android SDK 36
        run: |
          mkdir -p backup_files
          cp -r android/app/src/main/AndroidManifest.xml backup_files/ 2>/dev/null || true
          cp pubspec.yaml backup_files/
          rm -rf android
          flutter create . --project-name viral_clip_studio --org com.avinash
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts

      - name: Restore Custom Manifest & Pubspec
        run: |
          cp backup_files/pubspec.yaml pubspec.yaml
          cp backup_files/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viral_Clip_Studio_Android_APK
          path: build/app/outputs/flutter-apk/app-release.apk
